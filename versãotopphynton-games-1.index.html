body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}

.wrap{max-width:1120px;margin:0 auto;padding:0 1rem}
/* header */
.header{text-align:center;padding:2.6rem 1rem 1.8rem;background:radial-gradient(ellipse at top,#1a1528 0%,var(--bg) 70%);border-bottom:1px solid var(--border)}
.logo-wrap{display:inline-flex;align-items:center;gap:.4rem;margin-bottom:.5rem}

.site-name{font-size:1.15rem;font-weight:700;color:var(--accent2);letter-spacing:1px;margin-bottom:.2rem}
.creator{font-size:.92rem;color:var(--muted);margin-bottom:1.2rem}
.creator span,.footer-creator span{color:var(--accent2);font-weight:700}
.disclaimer{max-width:740px;margin:0 auto;font-size:.84rem;color:var(--muted);background:rgba(139,92,246,.07);border:1px solid rgba(139,92,246,.22);border-radius:12px;padding:.9rem 1.2rem;line-height:1.6}
/* controls */
.controls{margin-top:1.6rem;display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;justify-content:space-between}
.lang-switch,.categories{display:flex;flex-wrap:wrap;gap:.35rem}
.lang-btn,.cat-btn,.tool-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:.38rem .8rem;border-radius:999px;font-size:.78rem;font-weight:600;transition:background .2s,color .2s,border-color .2s}
.lang-btn{border-radius:8px;padding:.35rem .7rem}
.lang-btn:hover,.lang-btn[aria-pressed=true],.cat-btn:hover,.cat-btn[aria-pressed=true],.tool-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tools{display:flex;gap:.5rem;flex:1;justify-content:flex-end;min-width:240px}
.search-box{flex:1;max-width:300px}
.search-box input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:.5rem .9rem;border-radius:8px;font-size:.88rem}

/* grid */
.games-section{margin:1.6rem auto 2.4rem}
.section-title{font-size:1.1rem;font-weight:600;margin-bottom:1rem}
.section-title small{font-size:.8rem;color:var(--muted);font-weight:400}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.game-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,transform .2s}
.game-card:hover{background:var(--card2);border-color:var(--accent);transform:translateY(-3px)}
.game-thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative}
.game-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:var(--accent2);font-size:.68rem;padding:.15rem .5rem;border-radius:6px;font-weight:600}
.fav-btn{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.55);font-size:1.05rem;line-height:1}
.fav-btn[aria-pressed=true]{background:rgba(139,92,246,.9)}
.game-info{padding:.9rem 1rem 1rem;flex:1;display:flex;flex-direction:column}
.game-title{font-weight:700;font-size:1rem;background:none;border:none;text-align:left}
.game-creator{font-size:.76rem;color:var(--muted);margin-bottom:.4rem}
.game-desc{font-size:.8rem;color:var(--muted);margin-bottom:.7rem;flex:1}
.game-tags,.modal-tags,.support-badges{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem}
.tag{font-size:.68rem;background:rgba(139,92,246,.14);color:var(--accent2);padding:.12rem .45rem;border-radius:5px}
.tag.files{background:rgba(239,68,68,.2);color:var(--warn)}
.play-btn,.modal-play{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;padding:.55rem;border-radius:9px;font-weight:600;font-size:.88rem;transition:background .2s}
button.play-btn{border:none;width:100%;cursor:pointer;font-family:inherit}
.play-btn:hover,.modal-play:hover{background:var(--accent-d)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:2.5rem 1rem;border:1px dashed var(--border);border-radius:14px}

.box{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(76,29,149,.15));border:1px solid rgba(139,92,246,.3);border-radius:16px;padding:1.5rem 1.3rem;text-align:center;margin-bottom:1.5rem}

#copSection ul{margin:.5rem 0 0 1.2rem;line-height:1.7}
#copCode,.cop-in{width:100%;background:#0a0a0e;color:#e8e0ff;border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;font:12px/1.5 ui-monospace,Consolas,monospace}
#copCode{height:240px;resize:vertical;margin:.5rem 0}
#copFrame{width:100%;height:420px;border:1px solid var(--border);border-radius:8px;background:#fff;margin-top:.8rem}
.btn.run{background:var(--accent);border-color:var(--accent);color:#fff}
.menu-btn{position:fixed;top:10px;right:10px;z-index:900;width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:1.3rem}

.menu h4{font-size:.85rem;margin-bottom:.5rem}
.menu .row{margin:0 0 1rem}

.player{position:fixed;inset:0;z-index:1100;background:#000;display:none;flex-direction:column}
.player.open{display:flex}
.player-bar{display:flex;gap:.5rem;align-items:center;padding:.5rem .8rem;background:#0a0a0e;color:#fff}

.proj .tool-btn{padding:.25rem .6rem}

select.cop-in{width:auto}

.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);border:none;width:34px;height:34px;border-radius:50%;font-size:1.2rem;z-index:2}
.modal-hero{height:170px;display:flex;align-items:center;justify-content:center;font-size:4rem}
.modal-body{padding:1.2rem 1.3rem 1.5rem}
.modal-title{font-size:1.35rem;font-weight:700}
.modal-creator{font-size:.82rem;color:var(--muted);margin-bottom:.8rem}
.modal-desc{font-size:.92rem;margin-bottom:1rem}
.modal-play{padding:.75rem;font-size:1rem;border-radius:12px;font-weight:700}
.modal-note{font-size:.76rem;color:var(--muted);margin-top:.8rem;text-align:center}
.support-badges{justify-content:center;margin:.6rem 0 0}

.report{display:block;text-align:center;margin-top:.8rem;font-size:.78rem;color:var(--muted)}

.loading-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s,visibility .35s}
.loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.loading-logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:3.2rem;color:#e8e0ff;text-shadow:0 0 24px rgba(139,92,246,.6);margin-bottom:1rem}
.loading-bar{width:160px;height:4px;background:var(--border);border-radius:4px;overflow:hidden}
.loading-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:bar .6s ease forwards}
@keyframes bar{to{width:100%}}
@media(max-width:600px){.tools{min-width:100%}.search-box{max-width:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const htmlLang={pt:"pt-BR",en:"en",es:"es",ja:"ja",zh:"zh",hi:"hi"};
const CAT_ORDER=["original","minijogos","racing","adventure","shooter","retro","ps2","nintendo","rpg","indie"];
const $=id=>document.getElementById(id);
const t=k=>(i18n[lang]&&i18n[lang][k])||i18n.en[k]||i18n.pt[k]||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let acct=store.get("pgr-session",null);if(acct&&!store.get("pgr-users",{})[acct])acct=null;
const uk=k=>"pgr-"+(acct?"u:"+acct+":":"")+k;
let bests=store.get(uk("best"),{});
let lang=store.get("pgr-lang",null);
if(!i18n[lang]){const n=(navigator.language||"pt").slice(0,2);lang=i18n[n]?n:"pt";}
let cat="all",term="",favs=store.get(uk("favs"),[]),lastFocus=null;

const hue=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return h};
const bg=id=>{const h=hue(id);return `linear-gradient(145deg,hsl(${h} 55% 16%),hsl(${(h+40)%360} 60% 30%))`};

function visible(){
  const q=norm(term);
  return games.filter(g=>{
    const okCat=cat==="all"||(cat==="favs"?favs.includes(g.id):(g.cat||[]).includes(cat));
    return okCat&&(!q||norm(g.title).includes(q)||norm(g.creator).includes(q));
  });
}
function renderCats(){
  const used=new Set(games.flatMap(g=>g.cat||[]));
  const list=["all","favs",...CAT_ORDER.filter(c=>used.has(c)),...(used.has("cop")?["cop"]:[])];
  $("cats").innerHTML=list.map(c=>`<button class="cat-btn" data-cat="${c}" aria-pressed="${c===cat}">${esc(t(c==="favs"?"favs":c))}</button>`).join("");
}
function render(){
  const list=visible();
  $("count").textContent="("+list.length+")";
  $("grid").innerHTML=list.length?list.map(g=>{
    const isFav=favs.includes(g.id);
    return `<article class="game-card" data-id="${esc(g.id)}">
      <div class="game-thumb" style="background:${bg(g.id)}"><span aria-hidden="true">${g.icon||"🎮"}</span><span class="game-badge">${esc(g.badge)}</span>
        <button class="fav-btn" data-fav="${esc(g.id)}" aria-pressed="${isFav}" aria-label="${esc(t("fav"))}: ${esc(g.title)}">${isFav?"♥":"♡"}</button></div>
      <div class="game-info">
        <button class="game-title" data-open="${esc(g.id)}">${esc(g.title)}</button>
        <div class="game-creator">${esc(t("by"))} ${esc(g.creator)}</div>
        <div class="game-desc">${esc(g.desc[lang]||g.desc.en||g.desc.pt)}</div>
        <div class="game-tags">${bests[g.id]?`<span class="tag">★ ${esc(bests[g.id])}</span>`:""}${(g.cat||[]).map(c=>`<span class="tag">${esc(t(c))}</span>`).join("")}${g.needsFiles?`<span class="tag files">${esc(t("files"))}</span>`:""}</div>
        ${g.own?`<button class="play-btn" data-own="${esc(g.id)}">${esc(t("play"))}</button>`:`<a class="play-btn" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(t("play"))}</a>`}
      </div></article>`}).join("")
    :`<div class="empty">${esc(t(cat==="favs"&&!term?"noFav":"empty"))}</div>`;
  $("copSection").classList.toggle("show",cat==="cop");
}
function applyLang(){
  document.documentElement.lang=htmlLang[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll(".lang-btn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  renderCats();render();
}
function openModal(g){
  lastFocus=document.activeElement;
  $("mHero").style.background=bg(g.id);$("mHero").textContent=g.icon||"🎮";
  $("mTitle").textContent=g.title;
  $("mCreator").textContent=t("by")+" "+g.creator;
  $("mDesc").textContent=g.desc[lang]||g.desc.en||g.desc.pt;
  $("mTags").innerHTML=(g.cat||[]).map(c=>`<span class="tag">${esc(t(c))}</span>`).join("")+(g.needsFiles?`<span class="tag files">${esc(t("files"))}</span>`:"");
  $("mPlay").href=g.url;$("mPlay").textContent=t("play");
  $("mNote").textContent=g.needsFiles?t("filesNote"):t(g.own?"ownNote":"openNote");$("mPlay").style.display=g.own?"none":"";
  $("mSupport").innerHTML=(g.support||[]).map(s=>`<span class="support-badge">${esc(t(s))}</span>`).join("");
  $("mReport").textContent="⚠ "+t("report");
  $("mReport").href="mailto:phytongamesredirecionador@gmail.com?subject="+encodeURIComponent("PGR: "+g.title)+"&body="+encodeURIComponent(g.url);
  const h=$("mHere");h.style.display=(g.iframe||g.own)?"block":"none";h.onclick=()=>{closeModal();g.own?playOwn(g.id):openPlayer({title:g.title,url:g.embed||g.url,page:g.url})};
  $("modal").classList.add("active");$("mClose").focus();
}
function closeModal(){$("modal").classList.remove("active");if(lastFocus)lastFocus.focus()}

$("langs").addEventListener("click",e=>{const b=e.target.closest(".lang-btn");if(!b)return;lang=b.dataset.lang;store.set("pgr-lang",lang);applyLang()});
$("cats").addEventListener("click",e=>{const b=e.target.closest(".cat-btn");if(!b)return;cat=b.dataset.cat;renderCats();render()});
$("search").addEventListener("input",e=>{term=e.target.value;render()});
$("randomBtn").addEventListener("click",()=>{const l=visible();if(l.length)openModal(l[Math.floor(Math.random()*l.length)])});
$("grid").addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){const id=f.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];store.set(uk("favs"),favs);render();return}
  const ob=e.target.closest("[data-own]");if(ob){playOwn(ob.dataset.own);return}
  if(e.target.closest(".play-btn"))return;
  const c=e.target.closest(".game-card");
  if(c)openModal(games.find(g=>g.id===c.dataset.id));
});
$("mClose").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("modal").classList.contains("active"))closeModal();
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("search").focus()}
});

const STARTER=`<!DOCTYPE html><meta name=viewport content="width=device-width"><body style="margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center"><canvas id=c width=320 height=400 style="background:#1b1b2f;max-width:100%"></canvas><p>← → / touch</p><script>
const c=document.getElementById("c"),x=c.getContext("2d");let p=150,s=0,e=[],k={};
onkeydown=a=>k[a.key]=1;onkeyup=a=>k[a.key]=0;
c.ontouchmove=a=>{p=a.touches[0].clientX-c.getBoundingClientRect().left-10;a.preventDefault()};
setInterval(()=>{if(k.ArrowLeft)p-=5;if(k.ArrowRight)p+=5;p=Math.max(0,Math.min(300,p));if(Math.random()<.05)e.push([Math.random()*300,0]);x.clearRect(0,0,320,400);x.fillStyle="#8b5cf6";x.fillRect(p,370,20,20);x.fillStyle="#f87171";e.forEach(a=>{a[1]+=3;x.fillRect(a[0],a[1],20,20);if(a[1]>350&&a[1]<390&&Math.abs(a[0]-p)<20){s=0;e=[]}});e=e.filter(a=>a[1]<400);s++;x.fillStyle="#fff";x.fillText("Score "+s,8,16)},30)
<\/script>`;
const ed=$("copCode"),fr=$("copFrame");
ed.value=store.get("pgr-cop",STARTER);
function codeOut(){const m=ed.value.match(/```(?:html)?\s*([\s\S]*?)```/);return m?m[1]:ed.value}
$("copRun").addEventListener("click",()=>{store.set("pgr-cop",ed.value);fr.srcdoc=codeOut()});
$("copReset").addEventListener("click",()=>{ed.value=STARTER;store.set("pgr-cop",STARTER);fr.srcdoc=STARTER});
$("copDl").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([codeOut()],{type:"text/html"}));a.download="meu-jogo.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$("copAiCopy").addEventListener("click",()=>{const d=$("copAiIn").value.trim()||"...";const p=t("copTpl").replace("{d}",d);const b=$("copAiCopy");const done=()=>{b.textContent=t("copAiDone");setTimeout(()=>b.innerHTML=t("copAiCopy"),2200)};navigator.clipboard?navigator.clipboard.writeText(p).then(done).catch(()=>{}):0});

function setTheme(m){store.set("pgr-theme",m);const eff=m==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;document.documentElement.dataset.theme=eff;document.querySelectorAll("[data-theme-btn]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeBtn===m))}
setTheme(store.get("pgr-theme","dark"));
document.querySelectorAll("[data-theme-btn]").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.themeBtn)));
$("menuBtn").addEventListener("click",()=>{const o=$("menu").classList.toggle("open");$("menuBtn").setAttribute("aria-expanded",o)});
$("clearData").addEventListener("click",()=>{if(confirm(t("clearConfirm"))){try{localStorage.clear()}catch(e){}location.reload()}});

function openPlayer(o){cur=null;
  lastFocus=document.activeElement;const fr2=$("pFrame");
  fr2.setAttribute("sandbox",o.url?"allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms allow-modals":"allow-scripts allow-pointer-lock allow-modals");
  $("pTitle").textContent=o.title;$("pOpen").style.display=o.url?"":"none";$("pHint").style.display=o.url?"":"none";
  if(o.url){$("pOpen").href=o.page||o.url;fr2.removeAttribute("srcdoc");fr2.src=o.url}else{fr2.removeAttribute("src");fr2.srcdoc=o.code}
  fr2.onload=()=>{try{fr2.contentWindow.focus()}catch(e){}};$("player").classList.add("open");$("pClose").focus();
}
function playOwn(id){const g=games.find(q=>q.id===id);if(g){openPlayer({title:g.title,code:ORIG[g.code]});cur=id}}
let cur=null;
function closePlayer(){cur=null;if(document.fullscreenElement)document.exitFullscreen();const f2=$("pFrame");f2.removeAttribute("srcdoc");f2.src="about:blank";$("player").classList.remove("open");if(lastFocus)lastFocus.focus()}
$("pClose").addEventListener("click",closePlayer);
$("pFs").addEventListener("click",()=>{const p=$("player");if(document.fullscreenElement)document.exitFullscreen();else if(p.requestFullscreen)p.requestFullscreen()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("player").classList.contains("open")&&!document.fullscreenElement)closePlayer();$("menu").classList.remove("open")}});

$("copFs").addEventListener("click",()=>{if(fr.requestFullscreen)fr.requestFullscreen()});
const SCAN=[[/\beval\s*\(|new\s+Function\s*\(/,"eval/Function"],[/fetch\s*\(|XMLHttpRequest|WebSocket|sendBeacon|EventSource/,"fetch/XHR/WebSocket"],[/document\.cookie|localStorage|sessionStorage|indexedDB/,"cookies/storage"],[/window\.top|\btop\.|\bparent\.|location\s*[.=]/,"top/parent/location"],[/window\.open|<form|<iframe|<object|<embed/i,"popups/forms/frames"],[/<script[^>]+src\s*=|import\s*\(|@import|<link[^>]+href/i,"external resources"],[/atob\s*\(|fromCharCode|\\x[0-9a-f]{2}/i,"obfuscation"],[/https?:\/\//i,"external links"]];
function showScan(){const c=codeOut(),w=SCAN.filter(r=>r[0].test(c)).map(r=>r[1]);const el=$("copScan");el.className="scan "+(w.length?"warn":"ok");el.textContent=w.length?t("scanWarn")+" "+w.join(", "):t("scanOk");return w}
$("copRun").addEventListener("click",showScan);
function saveFile(name,code){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([code],{type:"text/html"}));a.download=name.replace(/[^\w\-]+/g,"_")+".html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let projects=store.get(uk("projects"),[]);
const community=[]; /* jogos aprovados pela equipe: {title:"",author:"",code:"<!DOCTYPE html>..."} */
function renderProjects(){
  $("copList").innerHTML=projects.length?projects.map(p=>`<div class="proj"><b>${esc(p.name)}</b><span class="tag">${esc(t(p.vis==="community"?"copCommunity":"copPrivate"))}</span><button class="tool-btn" data-a="play" data-id="${esc(p.id)}">${esc(t("playBtn"))}</button><button class="tool-btn" data-a="load" data-id="${esc(p.id)}">${esc(t("load"))}</button><button class="tool-btn" data-a="del" data-id="${esc(p.id)}">${esc(t("del"))}</button></div>`).join(""):`<p style="margin-top:.4rem">${esc(t("copMineEmpty"))}</p>`;
  $("copComm").innerHTML=community.length?community.map((c,i)=>`<div class="proj"><b>${esc(c.title)}</b><span class="tag">${esc(c.author||"")}</span><button class="tool-btn" data-c="${i}">${esc(t("playBtn"))}</button></div>`).join(""):`<p>${esc(t("copCommEmpty"))}</p>`;
}
$("copList").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const p=projects.find(x=>x.id===b.dataset.id);if(!p)return;
  if(b.dataset.a==="del"){projects=projects.filter(x=>x.id!==p.id);store.set(uk("projects"),projects);renderProjects()}
  else if(b.dataset.a==="load"){ed.value=p.code;$("copName").value=p.name;$("copVis").value=p.vis;showScan();fr.srcdoc=codeOut();ed.scrollIntoView({behavior:"smooth",block:"center"})}
  else openPlayer({title:p.name,code:p.code})});
$("copComm").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){const c=community[+b.dataset.c];openPlayer({title:c.title,code:c.code})}});
$("copSave").addEventListener("click",()=>{
  const name=$("copName").value.trim()||"Projeto",code=ed.value;
  if(code.length>200000){alert("Max 200 KB");return}
  const i=projects.findIndex(p=>p.name===name),p={id:i>=0?projects[i].id:Date.now().toString(36),name,vis:$("copVis").value,code,ts:Date.now()};
  if(i>=0)projects[i]=p;else{if(projects.length>=20){alert("Max 20");return}projects.unshift(p)}
  store.set(uk("projects"),projects);renderProjects();showScan()});
$("copSend").addEventListener("click",()=>{
  if(showScan().length)return;
  const name=$("copName").value.trim()||"Projeto";saveFile(name,codeOut());
  location.href="mailto:phytongamesredirecionador@gmail.com?subject="+encodeURIComponent("PGR Comunidade: "+name)+"&body="+encodeURIComponent("Anexe o arquivo .html baixado a este email. / Attach the downloaded .html file.")});

const b64=u=>btoa(String.fromCharCode(...u)),ub64=q=>Uint8Array.from(atob(q),c=>c.charCodeAt(0));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,256)))}
let aMode="in",fails=0,lockUntil=0;
function setMode(m){aMode=m;$("tabIn").setAttribute("aria-pressed",m=="in");$("tabUp").setAttribute("aria-pressed",m=="up");$("accGo").textContent=t(m=="in"?"accIn":"accCreate");$("accPass").autocomplete=m=="in"?"current-password":"new-password";$("accMsg").style.display="none"}
function aMsg(k){const e=$("accMsg");e.textContent=t(k);e.style.display="block"}
async function accSubmit(){
  const u=$("accUser").value.trim().toLowerCase(),p=$("accPass").value;
  if(!/^[a-z0-9_]{3,16}$/.test(u))return aMsg("errUser");if(p.length<6)return aMsg("errPass");
  if(!(window.crypto&&crypto.subtle))return aMsg("errCrypto");if(Date.now()<lockUntil)return aMsg("errLock");
  const us=store.get("pgr-users",{});
  if(aMode=="up"){if(us[u])return aMsg("errExists");const salt=crypto.getRandomValues(new Uint8Array(16));us[u]={s:b64(salt),h:await hashPw(p,salt)};store.set("pgr-users",us)}
  else{const r=us[u];if(!r||(await hashPw(p,ub64(r.s)))!==r.h){if(++fails>=5){fails=0;lockUntil=Date.now()+30000;return aMsg("errLock")}return aMsg("errBad")}}
  fails=0;$("accPass").value="";$("accModal").classList.remove("active");acct=u;store.set("pgr-session",u);reloadData()}
function reloadData(){favs=store.get(uk("favs"),[]);projects=store.get(uk("projects"),[]);bests=store.get(uk("best"),{});renderAcc();renderCats();render();renderProjects()}
function renderAcc(){$("accLine").textContent=acct?t("accHello").replace("{u}",acct):t("accGuest");$("accBtn").textContent=t(acct?"accOut":"accIn")}
$("accBtn").addEventListener("click",()=>{if(acct){acct=null;store.set("pgr-session",null);reloadData()}else{setMode("in");$("accModal").classList.add("active");$("menu").classList.remove("open");$("accUser").focus()}});
$("tabIn").addEventListener("click",()=>setMode("in"));$("tabUp").addEventListener("click",()=>setMode("up"));
$("accGo").addEventListener("click",accSubmit);$("accPass").addEventListener("keydown",e=>{if(e.key==="Enter")accSubmit()});
$("accClose").addEventListener("click",()=>$("accModal").classList.remove("active"));
$("accModal").addEventListener("click",e=>{if(e.target.id==="accModal")$("accModal").classList.remove("active")});
function accKeys(){const p=acct?"pgr-u:"+acct+":":"pgr-",o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith(p))continue;if(!acct&&(k.startsWith("pgr-u:")||["pgr-users","pgr-session","pgr-lang","pgr-theme"].includes(k)))continue;o[k.slice(p.length)]=localStorage.getItem(k)}}catch(e){}return o}
$("expBtn").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({pgr:1,data:accKeys()})],{type:"application/json"}));a.download="pgr-progresso.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$("impBtn").addEventListener("click",()=>$("impFile").click());
$("impFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f||f.size>2e6)return;const r=new FileReader();r.onload=()=>{try{const m=JSON.parse(r.result);if(m.pgr!==1||typeof m.data!=="object")throw 0;const p=acct?"pgr-u:"+acct+":":"pgr-";for(const k in m.data){if(/^[\w:\-]{1,60}$/.test(k)&&typeof m.data[k]==="string"&&m.data[k].length<300000)localStorage.setItem(p+k,m.data[k])}reloadData();alert(t("impOk"))}catch(x){alert(t("impBad"))}};r.readAsText(f);e.target.value=""});
window.addEventListener("message",e=>{
  if(!cur||e.source!==$("pFrame").contentWindow)return;const m=e.data;if(!m||typeof m!=="object")return;
  if(m.pgr==="load")e.source.postMessage({pgr:"data",data:store.get(uk("save:"+cur),{}),user:acct},"*");
  else if(m.pgr==="save"){let q;try{q=JSON.stringify(m.data)}catch(x){return}if(q&&q.length<60000)store.set(uk("save:"+cur),JSON.parse(q))}
  else if(m.pgr==="score"&&Number.isFinite(m.v)&&m.v>=0&&!(bests[cur]>=m.v)){bests[cur]=m.v;store.set(uk("best"),bests);render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("accModal").classList.remove("active")});
